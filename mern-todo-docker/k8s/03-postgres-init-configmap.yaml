# Same idea as the docker-entrypoint-initdb.d volume mounts in Compose,
# just re-expressed as a ConfigMap so it can be mounted as files into the pod.
# The official postgres image auto-runs any .sql file it finds in
# /docker-entrypoint-initdb.d, in filename order, but ONLY the first time
# it starts against an empty data directory (same rule as Docker).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: mern-todo
data:
  01-auth.sql: |
    CREATE TABLE IF NOT EXISTS users (
      id SERIAL PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      email VARCHAR(150) UNIQUE NOT NULL,
      password_hash TEXT NOT NULL,
      created_at TIMESTAMPTZ DEFAULT now()
    );
  02-todo.sql: |
    CREATE TABLE IF NOT EXISTS todos (
      id SERIAL PRIMARY KEY,
      user_id INTEGER NOT NULL,
      title VARCHAR(255) NOT NULL,
      is_done BOOLEAN DEFAULT false,
      created_at TIMESTAMPTZ DEFAULT now()
    );
