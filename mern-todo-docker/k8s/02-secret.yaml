# SENSITIVE VALUES - stringData below is plaintext ONLY so you can read/edit
# it easily; Kubernetes stores it base64-encoded in etcd (NOT encrypted by
# default - see the README's "Secrets" section for what that actually means
# and doesn't mean).
#
# DO NOT commit this file with real production values. In real life:
#   - keep this file out of git (add it to .gitignore), or
#   - generate it imperatively instead of committing a file at all:
#       kubectl create secret generic mern-secrets -n mern-todo \
#         --from-literal=POSTGRES_PASSWORD='some-strong-password' \
#         --from-literal=JWT_SECRET='some-long-random-string' \
#         --from-literal=DATABASE_URL='postgres://todo:some-strong-password@postgres:5432/tododb'
#   - or better yet, in a real AKS deployment, use Azure Key Vault +
#     the Secrets Store CSI Driver so secrets never live in a YAML file
#     or in etcd's plaintext form at all. See README Section 5.
apiVersion: v1
kind: Secret
metadata:
  name: mern-secrets
  namespace: mern-todo
type: Opaque
stringData:
  POSTGRES_PASSWORD: "todo"
  JWT_SECRET: "change_this_to_a_long_random_secret"
  # Duplicates POSTGRES_USER/DB from the ConfigMap because this is the
  # single value auth-service/todo-service actually read (DATABASE_URL),
  # while postgres itself reads the three separate POSTGRES_* vars.
  # Same duplication existed in the Docker Compose .env files - not new.
  DATABASE_URL: "postgres://todo:todo@postgres:5432/tododb"
